services:
  - type: web
    name: prime
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SECURE_COOKIES
        value: "true"
      - key: ENABLE_HSTS
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: SEARCH_BROWSER_FALLBACK
        value: "false"
      - key: SEARCH_FETCH_PAGES
        value: "true"
      - key: PRIME_MODEL_URL
        sync: false
      - key: PRIME_MODEL_NAME
        sync: false
      # Keep the Render web service responsive unless you explicitly configure a reachable remote model.
      - key: PRIME_MODEL_ENABLED
        value: "false"
      # Vision stays off by default on Render because the web service does not run local Ollama.
      # Set PRIME_VISION_ENABLED=true and provide PRIME_VISION_MODEL_URL for a reachable remote vision model.
      - key: PRIME_VISION_ENABLED
        value: "false"
      - key: PRIME_VISION_MODEL
        value: "qwen3-vl:8b"
      - key: PRIME_VISION_MODEL_URL
        sync: false
      - key: PRIME_EXPOSE_SEARCH_METADATA
        value: "false"
      - key: PRIME_DATA_DIR
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_IMAGE_MODEL
        sync: false
      - key: PRIME_IMAGE_SERVICE_URL
        sync: false
      - key: PRIME_IMAGE_ENGINE_TOKEN
        sync: false
