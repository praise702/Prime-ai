<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime — Create account</title><link rel="stylesheet" href="create-account.css"></head><body><main class="auth"><section class="card"><div class="brand">Prime</div><h1>Create account</h1><p>Your account and conversations are stored by your Prime server.</p><form id="signupForm"><input id="name" maxlength="255" autocomplete="name" placeholder="Name" required><input id="email" type="email" autocomplete="email" placeholder="Email" required><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Password (8+ characters)" required><input id="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Confirm password" required><button id="createBtn" type="submit">Create account</button></form><p id="message" class="message"></p><button id="backBtn" class="secondary">Back to sign in</button></section></main><script type="module" src="create-account.js"></script></body></html>
